[project]
name = "medical-rag-evals"
version = "0.1.0"
description = "Synthetic clinic patient-information RAG assistant with a RAGAS evaluation gate."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Muhammad Mustafa" }]
dependencies = [
  "anthropic>=0.40",
  "faiss-cpu>=1.8",
  "numpy>=1.26",
  "openai>=1.50",
  "pgvector>=0.3",
  "psycopg[binary]>=3.2",
  "pyyaml>=6",
  "ragas==0.4.3",
  "rapidfuzz>=3",
]

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
]

[project.scripts]
clinic-rag = "clinic_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinic_rag"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["clinic_rag"]
mypy_path = "src"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
  "ragas",
  "ragas.*",
  "faiss",
  "psycopg",
  "psycopg.*",
  "pgvector",
  "pgvector.*",
  "openai",
  "openai.*",
  "anthropic",
  "anthropic.*",
  "yaml",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore:Importing NonLLMContextRecall:DeprecationWarning",
]
